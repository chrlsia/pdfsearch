name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for multiple OS
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: pdfsearch

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: pdfsearch.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: pdfsearch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare dist folder
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/

      # --- NEW: zip binaries per platform ---
      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf pdfsearch-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          powershell Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath pdfsearch-${{ matrix.target }}.zip

      # --- NEW: Create GitHub Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}