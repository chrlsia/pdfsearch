[package]
name = "pdfsearch"
version = "0.1.0"
edition = "2024"

[dependencies]
pdf-extract = "0.6"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1.8"
indicatif="0.17"
colored="2"
glob = "0.3"

# clearscreen="4.0.3"

[package.metadata.deb]
maintainer = "Chris Siann"
depends = "poppler-utils"
section = "utility"
priority = "optional"
assets = [
    ["target/release/pdfsearch", "usr/bin/", "755"],
]